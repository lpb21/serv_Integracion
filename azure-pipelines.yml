# ============================================================================
# CI — Swift SQS Connector (bipcld0465000-cnf-swift-int-alliance-cloud)
# ============================================================================
# Basado en la plantilla corporativa azure-pipelinePYTHON_v1_GITFLOW.yml
# (repo bipal0259000-base-pipelines-ci-docs). Construye, prueba, analiza con
# SonarQube y publica el artefacto. NO despliega: el despliegue por ambiente
# lo hace el release pipeline (INT / QA / PROD).
#
# Ajustes respecto a la plantilla base:
#   - sonarSources: el código está en lambdas/ y shared/ (no en src/)
#   - unitTestCommand: corre tests/unit y mide cobertura sobre lambdas/shared
#   - paso extra: empaquetar las 4 Lambdas (ZIP con cryptography para Lambda)
#     ANTES de armar el tar.gz, para que los ZIPs viajen en el artefacto
# ============================================================================

variables:
# variable de grupo de artifactory
- group: Artifactory
# Propiedad del sonarQube para indicar el directorio a analizar
- name: sonarSources
  value: 'lambdas,shared'
# propiedad de sonarQube para indicar los directorios a excluir en el análisis
- name: sonarExclusions
  value: 'tests/**,scripts/**,resources/**,infrastructure/**'
# propiedad de sonarQube para indicar el directorio donde se encontrara el reporte de covertura
- name: sonarCoveragePaths
  value: '$(System.DefaultWorkingDirectory)/coverage.xml'
# Nombre del service connection para tarea de sonarQube
- name: sonarQubeServiceEndpoint
  value: 'SonarLts'
# nombre del script de pruebas unitarias
- name: unitTestCommand
  value: 'coverage run --source=lambdas,shared -m pytest tests/unit && coverage xml --omit=./venv/* && mkdir coverage && cp ./coverage.xml ./coverage/coverage.xml'
# Dependencias a instalar
- name: path_dependencies_file
  value: 'requirements.txt'
# Versión que se descargará en el agente temporalmente
- name: versionPython
  value: '3.12'

resources:
  repositories:
    - repository: template
      type: git
      name: DevOps/_git/templates-yaml
      ref: 'refs/heads/master' # siempre debemos apuntar a master

trigger:
  - master
  - develop
  - develop/*
  - release
  - release/*

name: $(date:yyyyMMdd)$(rev:.r)

stages:
- stage: develop
  variables:
  - group: integracion
  - group: Artifactory
  # Repo virtual de PyPI en Artifactory para este ambiente
  - name: pypiVirtualRepo
    value: 'pypi-dev-virtual'
  condition: |
      or(
            startsWith(variables['build.sourceBranch'], 'refs/heads/feature'),
            startsWith(variables['build.sourceBranch'], 'refs/heads/develop'),
            startsWith(variables['System.PullRequest.TargetBranch'], 'refs/heads/develop')
          )
  jobs:
  - job: CI
    pool:
      name: Docker-Agents
    workspace:
      clean: all
    steps:
    - template: build_PYTHON_v1.yml@template
      parameters:
        sonarCoveragePaths: ${{variables.sonarCoveragePaths}}
        sonarExclusions: ${{variables.sonarExclusions}}
        sonarSources: ${{variables.sonarSources}}
        sonarQubeServiceEndpoint: ${{variables.sonarQubeServiceEndpoint}}
        unitTestCommand: ${{variables.unitTestCommand}}
        path_dependencies_file: ${{variables.path_dependencies_file}}
        versionPython: ${{variables.versionPython}}
        installLZ: false
    - template: pipelines/templates/package-lambdas.yml
    - task: ArchiveFiles@1
      displayName: 'Preparando artefacto a publicar'
      inputs:
        rootFolder: '$(Build.Repository.LocalPath)'
        includeRootFolder: false
        archiveType: tar
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).tar.gz'
    - task: PublishBuildArtifacts@1
      displayName: 'Publicando artefacto'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).tar.gz'
        ArtifactName: artifact

- stage: release
  variables:
  - group: calidad
  - group: Artifactory
  - name: pypiVirtualRepo
    value: 'pypi-qa-virtual'   # CONFIRMAR nombre con DevOps
  condition: |
    or(
          startsWith(variables['build.sourceBranch'], 'refs/heads/bugfix'),
          startsWith(variables['build.sourceBranch'], 'refs/heads/release'),
          startsWith(variables['System.PullRequest.TargetBranch'], 'refs/heads/release')
        )
  jobs:
  - job: CI
    pool:
      name: Docker-Agents
    workspace:
      clean: all
    steps:
    - template: build_PYTHON_v1.yml@template
      parameters:
        sonarCoveragePaths: ${{variables.sonarCoveragePaths}}
        sonarExclusions: ${{variables.sonarExclusions}}
        sonarSources: ${{variables.sonarSources}}
        sonarQubeServiceEndpoint: ${{variables.sonarQubeServiceEndpoint}}
        unitTestCommand: ${{variables.unitTestCommand}}
        path_dependencies_file: ${{variables.path_dependencies_file}}
        versionPython: ${{variables.versionPython}}
        installLZ: false
    - template: pipelines/templates/package-lambdas.yml
    - task: ArchiveFiles@1
      displayName: 'Preparando artefacto a publicar'
      inputs:
        rootFolder: '$(Build.Repository.LocalPath)'
        includeRootFolder: false
        archiveType: tar
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).tar.gz'
    - task: PublishBuildArtifacts@1
      displayName: 'Publicando artefacto'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).tar.gz'
        ArtifactName: artifact

- stage: master
  variables:
  - group: produccion
  - group: Artifactory-produccion
  - name: pypiVirtualRepo
    value: 'pypi-prod-virtual'   # CONFIRMAR nombre con DevOps
  condition: |
    or(
          startsWith(variables['build.sourceBranch'], 'refs/heads/hotfix'),
          eq(variables['build.sourceBranch'], 'refs/heads/master'),
          startsWith(variables['System.PullRequest.TargetBranch'], 'refs/heads/master')
        )
  jobs:
  - job: CI
    pool:
      name: Docker-Agents
    workspace:
      clean: all
    steps:
    - template: build_PYTHON_v1.yml@template
      parameters:
        sonarCoveragePaths: ${{variables.sonarCoveragePaths}}
        sonarExclusions: ${{variables.sonarExclusions}}
        sonarSources: ${{variables.sonarSources}}
        sonarQubeServiceEndpoint: ${{variables.sonarQubeServiceEndpoint}}
        unitTestCommand: ${{variables.unitTestCommand}}
        path_dependencies_file: ${{variables.path_dependencies_file}}
        versionPython: ${{variables.versionPython}}
        installLZ: false
    - template: pipelines/templates/package-lambdas.yml
    - task: ArchiveFiles@1
      displayName: 'Preparando artefacto a publicar'
      inputs:
        rootFolder: '$(Build.Repository.LocalPath)'
        includeRootFolder: false
        archiveType: tar
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).tar.gz'
    - task: PublishBuildArtifacts@1
      displayName: 'Publicando artefacto'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).tar.gz'
        ArtifactName: artifact