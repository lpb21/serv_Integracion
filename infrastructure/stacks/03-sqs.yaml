AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Swift SQS Connector — SQS (3/7)
  Colas SQS propias del conector: DLQ y send-results.
  Las colas del core bancario NO se crean aquí —
  se referencian como parámetros en otros stacks.

  Stack name recomendado: swift-sqs-{env}-sqs
  Deploy order: 3 de 7 — no depende de otros stacks.

# Colas del core (NO se crean en este stack — solo se referencian por nombre):
#   CoreMtInboundQueueName  → mensajes FIN entrantes
#   CoreMxInboundQueueName  → mensajes MX entrantes
#   CoreOutboundQueueName   → mensajes salientes MT/MX
#   CoreFileActQueueName    → FileAct (opcional)

# Estrategia por ambiente:
#   - dev:  las colas que simulan a Cobis se crean APARTE (colas dummy) y aca
#           solo se referencian por nombre. Sirven para probar el flujo como si
#           estuvieramos conectados al core.
#   - prod: se apunta a las colas REALES de Cobis (que ya existen). Tampoco se
#           crean aca; solo se referencian.
#   En ambos casos este stack unicamente referencia las colas del core; nunca
#   las crea. Lo que si crea son las colas propias del conector (DLQ y
#   send-results).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  banistmoclasificaciondisponibilidad:
      Type: String
  banistmoclasificacionintegridad:
    Type: String
  banistmoclasificacionconfidencialidad:
    Type: String


  # Colas del core — se usan para exportar las URLs completas
  CoreInboundQueueName:
    Type: String
    Description: Cola SQS FIFO de entrada del core — MT y MX juntos (Swift -> core)

  CoreOutboundMtQueueName:
    Type: String
    Description: Cola SQS FIFO de salida del core para mensajes MT (core -> Swift)

  CoreOutboundMxQueueName:
    Type: String
    Description: Cola SQS FIFO de salida del core para mensajes MX (core -> Swift)

  CoreFileActQueueName:
    Type: String
    Default: ''
    Description: Nombre de la cola SQS del core para FileAct (opcional)

Conditions:
  HasFileActQueue: !Not [!Equals [!Ref CoreFileActQueueName, '']]

Resources:

  # ── DLQ del conector ─────────────────────────────────────────────────────
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'swift-sqs-${Environment}-dlq.fifo'
      FifoQueue: true
      MessageRetentionPeriod: 1209600   # 14 días
      Tags:
        - Key: Project
          Value: swift-sqs-connector
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: sqs
        - Key: banistmo:clasificacion-disponibilidad
          Value: !Ref banistmoclasificaciondisponibilidad
        - Key: banistmo:clasificacion-integridad
          Value: !Ref banistmoclasificacionintegridad
        - Key: banistmo:clasificacion-confidencialidad
          Value: !Ref banistmoclasificacionconfidencialidad

  # ── Send Results — conector notifica al core el resultado de envíos ───────
  SendResultsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'swift-sqs-${Environment}-send-results.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400    # 1 día
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: swift-sqs-connector
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: sqs
        - Key: banistmo:clasificacion-disponibilidad
          Value: !Ref banistmoclasificaciondisponibilidad
        - Key: banistmo:clasificacion-integridad
          Value: !Ref banistmoclasificacionintegridad
        - Key: banistmo:clasificacion-confidencialidad
          Value: !Ref banistmoclasificacionconfidencialidad

  # ── DLQ estándar para fallos de invocación asíncrona del dispatcher ───────
  # Lambda async NO acepta FIFO como destino OnFailure, por eso es estándar.
  DispatcherAsyncDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'swift-sqs-${Environment}-dispatcher-async-dlq'
      MessageRetentionPeriod: 1209600   # 14 días
      Tags:
        - Key: Project
          Value: swift-sqs-connector
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: sqs
        - Key: banistmo:clasificacion-disponibilidad
          Value: !Ref banistmoclasificaciondisponibilidad
        - Key: banistmo:clasificacion-integridad
          Value: !Ref banistmoclasificacionintegridad
        - Key: banistmo:clasificacion-confidencialidad
          Value: !Ref banistmoclasificacionconfidencialidad

Outputs:

  # ── DLQ ──────────────────────────────────────────────────────────────────
  DlqUrl:
    Description: URL de la DLQ del conector
    Value: !Ref DeadLetterQueue
    Export:
      Name: !Sub 'swift-sqs-${Environment}-dlq-url'

  DlqArn:
    Description: ARN de la DLQ del conector
    Value: !GetAtt DeadLetterQueue.Arn
    Export:
      Name: !Sub 'swift-sqs-${Environment}-dlq-arn'

  DispatcherAsyncDlqArn:
    Description: ARN de la DLQ estándar para fallos async del dispatcher
    Value: !GetAtt DispatcherAsyncDlq.Arn
    Export:
      Name: !Sub 'swift-sqs-${Environment}-dispatcher-async-dlq-arn'

  # ── Send Results ──────────────────────────────────────────────────────────
  SendResultsUrl:
    Description: URL de la cola send-results
    Value: !Ref SendResultsQueue
    Export:
      Name: !Sub 'swift-sqs-${Environment}-send-results-url'

  SendResultsArn:
    Description: ARN de la cola send-results
    Value: !GetAtt SendResultsQueue.Arn
    Export:
      Name: !Sub 'swift-sqs-${Environment}-send-results-arn'

  # ── Colas del core (ARNs construidos para el IAM stack) ──────────────────
  # 1 entrada (MT+MX) / 2 salidas (MT, MX)
  CoreInboundArn:
    Description: ARN de la cola de entrada del core (MT y MX)
    Value: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${CoreInboundQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-inbound-arn'

  CoreInboundUrl:
    Description: URL de la cola de entrada del core (MT y MX)
    Value: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${CoreInboundQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-inbound-url'

  # Salida MT: core -> Swift
  CoreOutboundMtArn:
    Description: ARN de la cola de salida MT del core
    Value: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${CoreOutboundMtQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-outbound-mt-arn'

  CoreOutboundMtUrl:
    Description: URL de la cola de salida MT del core
    Value: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${CoreOutboundMtQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-outbound-mt-url'

  # Salida MX: core -> Swift
  CoreOutboundMxArn:
    Description: ARN de la cola de salida MX del core
    Value: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${CoreOutboundMxQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-outbound-mx-arn'

  CoreOutboundMxUrl:
    Description: URL de la cola de salida MX del core
    Value: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${CoreOutboundMxQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-outbound-mx-url'

  CoreFileActArn:
    Condition: HasFileActQueue
    Description: ARN de la cola FileAct del core (si está configurada)
    Value: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${CoreFileActQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-fileact-arn'

  CoreFileActUrl:
    Condition: HasFileActQueue
    Description: URL de la cola FileAct del core (si está configurada)
    Value: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${CoreFileActQueueName}'
    Export:
      Name: !Sub 'swift-sqs-${Environment}-core-fileact-url'
