AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Swift SQS Connector — S3 Deploy Bucket
  Bucket de artefactos para el codigo empaquetado de las Lambdas.
  Block public access, versioning y cifrado SSE-S3 (AES256).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  banistmoclasificaciondisponibilidad:
    Type: String
  banistmoclasificacionintegridad:
    Type: String
  banistmoclasificacionconfidencialidad:
    Type: String
  banistmocumplimiento:
    Type: String
  banistmodominioinformacion:
    Type: String
  banistmodatospersonales:
    Type: String
  banistmoapplicationcode:
    Type: String
  banistmobillingmode:
    Type: String
  repository:
    Type: String
  tecenvironmenttype:
    Type: String
  banistmoapplicationoffice:
    Type: String

Resources:

  DeploymentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Bucket de artefactos de despliegue (zips de Lambda) sin datos de clientes. Pendiente confirmar con DevOps si se exige access logging corporativo."
    Properties:
      BucketName: !Sub 's3-0465-000-swiftint-${Environment}-deployment'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: 5YearsExpiration
            Status: Enabled
            Prefix: ""
            ExpirationInDays: 1826
      Tags:
        - Key: Project
          Value: swift-sqs-connector
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: s3-deploy
        - Key: banistmo:clasificacion-disponibilidad
          Value: !Ref banistmoclasificaciondisponibilidad
        - Key: banistmo:clasificacion-integridad
          Value: !Ref banistmoclasificacionintegridad
        - Key: banistmo:clasificacion-confidencialidad
          Value: !Ref banistmoclasificacionconfidencialidad
        - Key: banistmo:cumplimiento
          Value: !Ref banistmocumplimiento
        - Key: banistmo:dominio-informacion
          Value: !Ref banistmodominioinformacion
        - Key: banistmo:datos-personales
          Value: !Ref banistmodatospersonales
        - Key: banistmo:application-code
          Value: !Ref banistmoapplicationcode
        - Key: banistmo:billing-mode
          Value: !Ref banistmobillingmode
        - Key: banistmo:repository
          Value: !Ref repository
        - Key: banistmo:tec:environment-type
          Value: !Ref tecenvironmenttype
        - Key: banistmo:application-office
          Value: !Ref banistmoapplicationoffice


  DeploymentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DeploymentBucket.Arn
              - !Sub '${DeploymentBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:

  DeploymentBucketName:
    Description: Nombre del bucket de despliegue
    Value: !Ref DeploymentBucket
    Export:
      Name: !Sub 'swift-sqs-${Environment}-deploy-bucket-name'

  DeploymentBucketArn:
    Description: ARN del bucket de despliegue
    Value: !GetAtt DeploymentBucket.Arn
    Export:
      Name: !Sub 'swift-sqs-${Environment}-deploy-bucket-arn'